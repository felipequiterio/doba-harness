# 006 — distractor retrieval. Same model/sampling as 003-005.
# Solve is no-think (single/low-step problems); the select step is no-think too
# (a quick relevance judgment). Distractors are drawn from other problems'
# oracle cards, ranked by shared-variable confusability — deterministic.

local_model:
  provider: "ollama"
  base_url: "http://localhost:11434"
  model_name: "qwen3.5:4b"
  api_key_env: null
  max_tokens: 8192
  disable_thinking: true
  extra_body:
    options:
      num_ctx: 16384
      num_gpu: 99
    keep_alive: "30m"

frontier_model:                   # unused; kept for harness compat
  provider: "openrouter"
  base_url: "https://openrouter.ai/api/v1"
  model_name: "google/gemini-2.5-flash"
  api_key_env: "OPENROUTER_API_KEY"
  max_tokens: 4096

n_runs: 3
temperature: 0.2
default_tolerance_rel: 0.01
max_tool_turns: 8
max_total_turns: 16
seed: 1729

paths:
  dataset: "../datasets/astrodynamics/v1.json"
  runs_root: "results"

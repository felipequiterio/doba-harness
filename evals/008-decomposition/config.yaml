# 008 — decomposition. Knowledge is held constant (oracle cards in both
# conditions); only the SOLVE STRATEGY varies. Hard multi-step problems, so the
# monolithic solve thinks (003: +24pp on multi). In decompose mode the PLAN
# step thinks (it's reasoning about structure) and each LEAF runs no-think (a
# single-step calc, where 003 showed no-think wins and is cheaper).

local_model:
  provider: "ollama"
  base_url: "http://localhost:11434"
  model_name: "qwen3.5:4b"
  api_key_env: null
  max_tokens: 16384            # monolithic + plan budget
  disable_thinking: false      # MONO solve → thinking ON
  extra_body:
    options:
      num_ctx: 24576
      num_gpu: 99
    keep_alive: "30m"

decompose:
  # Reworked (post first-008): the model emits a PLAN of calculator
  # expressions; the harness executes them DETERMINISTICALLY (no leaf model
  # calls — that was the garbage-leaf bug). Only the plan call hits the model.
  plan_disable_thinking: false # PLAN → thinking ON (reason about structure)
  plan_max_tokens: 8192
  max_steps: 16

frontier_model:                # unused; kept for harness compat
  provider: "openrouter"
  base_url: "https://openrouter.ai/api/v1"
  model_name: "google/gemini-2.5-flash"
  api_key_env: "OPENROUTER_API_KEY"
  max_tokens: 4096

n_runs: 3
temperature: 0.2
default_tolerance_rel: 0.01
max_tool_turns: 12
max_total_turns: 24
# Caps the thinking-loop runaway: when cumulative completion tokens hit this,
# the harness forces one clean no-think commit. A legit astro-031 mono solve
# used ~17k; the runaways were 26-37k, so 24k bounds them with headroom.
max_completion_tokens: 24000
seed: 1729

paths:
  dataset: "../datasets/astrodynamics/v1.json"
  runs_root: "results"
